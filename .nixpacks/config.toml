# ==== Configuración Nixpacks para Laravel ====

[phases.setup]
# Instala PHP, Composer, Node y NPM
nixPkgs = [
  "php81",
  "php81Extensions.curl",
  "php81Extensions.mbstring",
  "php81Extensions.openssl",
  "php81Extensions.pdo",
  "php81Extensions.pdo_mysql",
  "php81Extensions.tokenizer",
  "php81Extensions.xml",
  "php81Extensions.fileinfo",
  "php81Extensions.zip",
  "php81Extensions.gd",
  "phpPackages.composer",
  "nodejs_18",
  "npm-9_x"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
